<div class="app-layout">
  <header class="app-header">
    <div class="header-content">
      <div class="header-brand">
        <h1 class="app-title">EffortIQ</h1>
        <p class="app-subtitle">Estimativa PERT de esforço de software</p>
      </div>
      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
          Estimativa
        </a>
        <a routerLink="/sobre" routerLinkActive="nav-link--active" class="nav-link">
          Sobre o Algoritmo
        </a>
        <button class="theme-toggle" (click)="theme.toggle()" [title]="theme.isDark() ? 'Mudar para tema claro' : 'Mudar para tema escuro'" aria-label="Alternar tema">
          @if (theme.isDark()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Zm11.894-4.606a.75.75 0 0 1 0 1.06l-1.591 1.591a.75.75 0 1 1-1.06-1.06l1.59-1.591a.75.75 0 0 1 1.061 0Zm-14.85 1.06a.75.75 0 0 1 1.06-1.06l1.591 1.59a.75.75 0 0 1-1.06 1.061L4.544 8.455Zm15.456 5.395a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75Zm-19.5 0a.75.75 0 0 1 .75-.75H5.25a.75.75 0 0 1 0 1.5H3a.75.75 0 0 1-.75-.75Zm16.894 4.606a.75.75 0 0 1-1.06 0l-1.591-1.591a.75.75 0 1 1 1.06-1.06l1.591 1.59a.75.75 0 0 1 0 1.061Zm-12.728 0a.75.75 0 0 1 0-1.06l1.59-1.591a.75.75 0 0 1 1.061 1.06l-1.591 1.591a.75.75 0 0 1-1.06 0ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18Z"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd"/></svg>
          }
        </button>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <span>Desenvolvido por Renan Barbosa &middot; 2025 <img src="https://flagcdn.com/16x12/br.png" width="16" height="12" alt="Brasil" class="footer-flag"></span>
  </footer>
</div>
